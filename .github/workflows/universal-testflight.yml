name: Console — Universal TestFlight (iPhone + iPad + Mac)

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "App version shown in TestFlight"
        required: true
        default: "1.1.1"
        type: string

permissions:
  contents: read

concurrency:
  group: console-universal-testflight
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      PROJECT: Console.xcodeproj
      SCHEME: Console
      BUNDLE_ID: com.console.beta

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest installed Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate native Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          test -d "$PROJECT"
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -showdestinations

      - name: Validate required secrets
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          for name in \
            APPLE_TEAM_ID \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY_BASE64 \
            CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_API_TOKEN
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub secret: $name"
              exit 1
            fi
          done

      - name: Resolve production Console endpoint
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          SCRIPT_NAME="console-realtime"
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          SUBDOMAIN_JSON="$(curl --fail-with-body --silent --show-error "${API}/workers/subdomain" -H "$AUTH")"
          SCRIPT_JSON="$(curl --fail-with-body --silent --show-error "${API}/workers/scripts/${SCRIPT_NAME}/subdomain" -H "$AUTH")"

          export SUBDOMAIN_JSON SCRIPT_JSON
          CONSOLE_SERVER_URL="$(python3 - <<'PY'
          import json, os
          account = json.loads(os.environ["SUBDOMAIN_JSON"])
          script = json.loads(os.environ["SCRIPT_JSON"])
          if not account.get("success"):
              raise SystemExit(f"Cloudflare workers subdomain lookup failed: {account.get('errors')}")
          if not script.get("success"):
              raise SystemExit(f"Cloudflare worker visibility lookup failed: {script.get('errors')}")
          if not script.get("result", {}).get("enabled"):
              raise SystemExit("console-realtime is not enabled on workers.dev")
          subdomain = account.get("result", {}).get("subdomain")
          if not subdomain:
              raise SystemExit("Cloudflare account workers.dev subdomain is empty")
          print(f"https://console-realtime.{subdomain}.workers.dev")
          PY
          )"

          echo "Resolved Console endpoint: $CONSOLE_SERVER_URL"
          curl --fail-with-body --silent --show-error "$CONSOLE_SERVER_URL/health"
          echo
          echo "CONSOLE_SERVER_URL=$CONSOLE_SERVER_URL" >> "$GITHUB_ENV"

      - name: Prepare App Store Connect API key
        id: key_path
        shell: bash
        env:
          API_KEY_SECRET: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          KEY_DIR="$RUNNER_TEMP/appstoreconnect"
          KEY_PATH="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          export KEY_PATH

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          raw = os.environ["API_KEY_SECRET"]
          out = Path(os.environ["KEY_PATH"])
          if "BEGIN PRIVATE KEY" in raw:
              data = raw.encode("utf-8")
          else:
              compact = "".join(raw.split())
              try:
                  data = base64.b64decode(compact, validate=True)
              except Exception as exc:
                  raise SystemExit("APP_STORE_CONNECT_API_KEY_BASE64 is invalid") from exc

          text = data.decode("utf-8", errors="strict")
          if "-----BEGIN PRIVATE KEY-----" not in text or "-----END PRIVATE KEY-----" not in text:
              raise SystemExit("The secret does not contain a valid App Store Connect .p8 key")
          out.write_text(text.strip() + "\n", encoding="utf-8")
          PY

          chmod 600 "$KEY_PATH"
          echo "path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: SwiftUI preflight — iPhone / iPad
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CONSOLE_SERVER_URL="$CONSOLE_SERVER_URL" \
            build

      - name: SwiftUI preflight — Mac Catalyst
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            CODE_SIGNING_ALLOWED=NO \
            CONSOLE_SERVER_URL="$CONSOLE_SERVER_URL" \
            build

      - name: Create App Store Connect export options
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Archive iPhone + iPad
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_PATH: ${{ steps.key_path.outputs.path }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Console-iOS.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CONSOLE_SERVER_URL="$CONSOLE_SERVER_URL" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            archive

      - name: Verify archived production endpoint — iPhone + iPad
        shell: bash
        run: |
          set -euo pipefail
          INFO_PLIST="$RUNNER_TEMP/Console-iOS.xcarchive/Products/Applications/Console.app/Info.plist"
          test -f "$INFO_PLIST"
          ARCHIVED_ENDPOINT="$(/usr/libexec/PlistBuddy -c 'Print :CONSOLE_SERVER_URL' "$INFO_PLIST")"
          echo "Archived endpoint: $ARCHIVED_ENDPOINT"
          if [ -z "$ARCHIVED_ENDPOINT" ] || [ "$ARCHIVED_ENDPOINT" != "$CONSOLE_SERVER_URL" ]; then
            echo "Expected endpoint: $CONSOLE_SERVER_URL"
            /usr/bin/plutil -p "$INFO_PLIST" || true
            exit 1
          fi

      - name: Upload iPhone + iPad build to TestFlight
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_PATH: ${{ steps.key_path.outputs.path }}
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Console-iOS.xcarchive" \
            -exportPath "$RUNNER_TEMP/Console-iOS-Export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Archive Mac Catalyst
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_PATH: ${{ steps.key_path.outputs.path }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -archivePath "$RUNNER_TEMP/Console-MacCatalyst.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER=NO \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CONSOLE_SERVER_URL="$CONSOLE_SERVER_URL" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            archive

      - name: Verify archived production endpoint — Mac Catalyst
        shell: bash
        run: |
          set -euo pipefail
          INFO_PLIST="$RUNNER_TEMP/Console-MacCatalyst.xcarchive/Products/Applications/Console.app/Contents/Info.plist"
          if [ ! -f "$INFO_PLIST" ]; then
            INFO_PLIST="$RUNNER_TEMP/Console-MacCatalyst.xcarchive/Products/Applications/Console.app/Info.plist"
          fi
          test -f "$INFO_PLIST"
          ARCHIVED_ENDPOINT="$(/usr/libexec/PlistBuddy -c 'Print :CONSOLE_SERVER_URL' "$INFO_PLIST")"
          echo "Archived endpoint: $ARCHIVED_ENDPOINT"
          if [ -z "$ARCHIVED_ENDPOINT" ] || [ "$ARCHIVED_ENDPOINT" != "$CONSOLE_SERVER_URL" ]; then
            echo "Expected endpoint: $CONSOLE_SERVER_URL"
            /usr/bin/plutil -p "$INFO_PLIST" || true
            exit 1
          fi

      - name: Upload Mac Catalyst build to TestFlight
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_PATH: ${{ steps.key_path.outputs.path }}
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Console-MacCatalyst.xcarchive" \
            -exportPath "$RUNNER_TEMP/Console-MacCatalyst-Export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Console-universal-TestFlight-failure-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/Console-iOS.xcarchive
            ${{ runner.temp }}/Console-MacCatalyst.xcarchive
            ${{ runner.temp }}/ExportOptions.plist
          if-no-files-found: ignore
          retention-days: 3
