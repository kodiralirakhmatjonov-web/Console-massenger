name: Console — Universal TestFlight (Fixed Signing)

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "App version shown in TestFlight"
        required: true
        default: "1.2.0"
        type: string

permissions:
  contents: read

concurrency:
  group: console-universal-testflight-fixed-signing
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 75

    env:
      PROJECT: Console.xcodeproj
      SCHEME: Console
      BUNDLE_ID: com.console.beta
      KEYCHAIN_PATH: ${{ runner.temp }}/console-signing.keychain-db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest installed Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Validate required secrets
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          CONSOLE_IOS_PROFILE_BASE64: ${{ secrets.CONSOLE_IOS_PROFILE_BASE64 }}
          CONSOLE_MAC_PROFILE_BASE64: ${{ secrets.CONSOLE_MAC_PROFILE_BASE64 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          for name in \
            APPLE_TEAM_ID \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY_BASE64 \
            APPLE_DISTRIBUTION_P12_BASE64 \
            APPLE_DISTRIBUTION_P12_PASSWORD \
            CONSOLE_IOS_PROFILE_BASE64 \
            CONSOLE_MAC_PROFILE_BASE64 \
            CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_API_TOKEN
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub secret: $name"
              exit 1
            fi
          done

      - name: Generate native Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          test -d "$PROJECT"
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -showdestinations

      - name: Resolve production Console endpoint
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          SCRIPT_NAME="console-realtime"
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          SUBDOMAIN_JSON="$(curl --fail-with-body --silent --show-error "${API}/workers/subdomain" -H "$AUTH")"
          SCRIPT_JSON="$(curl --fail-with-body --silent --show-error "${API}/workers/scripts/${SCRIPT_NAME}/subdomain" -H "$AUTH")"

          export SUBDOMAIN_JSON SCRIPT_JSON
          CONSOLE_SERVER_URL="$(python3 - <<'PY'
          import json, os
          account = json.loads(os.environ["SUBDOMAIN_JSON"])
          script = json.loads(os.environ["SCRIPT_JSON"])
          if not account.get("success"):
              raise SystemExit(f"Cloudflare workers subdomain lookup failed: {account.get('errors')}")
          if not script.get("success"):
              raise SystemExit(f"Cloudflare worker visibility lookup failed: {script.get('errors')}")
          if not script.get("result", {}).get("enabled"):
              raise SystemExit("console-realtime is not enabled on workers.dev")
          subdomain = account.get("result", {}).get("subdomain")
          if not subdomain:
              raise SystemExit("Cloudflare account workers.dev subdomain is empty")
          print(f"https://console-realtime.{subdomain}.workers.dev")
          PY
          )"

          echo "Resolved Console endpoint: $CONSOLE_SERVER_URL"
          curl --fail-with-body --silent --show-error "$CONSOLE_SERVER_URL/health"
          echo
          echo "CONSOLE_SERVER_URL=$CONSOLE_SERVER_URL" >> "$GITHUB_ENV"

      - name: Prepare App Store Connect API key
        id: api_key
        shell: bash
        env:
          API_KEY_SECRET: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          KEY_DIR="$RUNNER_TEMP/appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          export KEY_PATH

          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ["API_KEY_SECRET"]
          out = Path(os.environ["KEY_PATH"])
          if "BEGIN PRIVATE KEY" in raw:
              data = raw.encode()
          else:
              data = base64.b64decode("".join(raw.split()))
          text = data.decode("utf-8")
          if "-----BEGIN PRIVATE KEY-----" not in text or "-----END PRIVATE KEY-----" not in text:
              raise SystemExit("Invalid App Store Connect API key")
          out.write_text(text.strip() + "\n")
          PY

          chmod 600 "$KEY_PATH"
          echo "path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: Install fixed Apple Distribution certificate
        shell: bash
        env:
          P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          P12_PATH="$RUNNER_TEMP/console-distribution.p12"
          KEYCHAIN_PASSWORD="console-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export P12_PATH

          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          Path(os.environ["P12_PATH"]).write_bytes(base64.b64decode("".join(os.environ["P12_BASE64"].split())))
          PY

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          echo "Available signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          IDENTITY_COUNT="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -c 'Apple Distribution' || true)"
          if [ "$IDENTITY_COUNT" -lt 1 ]; then
            echo "Apple Distribution identity was not found in the imported .p12"
            exit 1
          fi

      - name: Install fixed provisioning profiles
        id: profiles
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROFILE_BASE64: ${{ secrets.CONSOLE_IOS_PROFILE_BASE64 }}
          MAC_PROFILE_BASE64: ${{ secrets.CONSOLE_MAC_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          IOS_RAW="$RUNNER_TEMP/console-ios.mobileprovision"
          MAC_RAW="$RUNNER_TEMP/console-mac.provisionprofile"
          export IOS_RAW MAC_RAW

          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          Path(os.environ["IOS_RAW"]).write_bytes(base64.b64decode("".join(os.environ["IOS_PROFILE_BASE64"].split())))
          Path(os.environ["MAC_RAW"]).write_bytes(base64.b64decode("".join(os.environ["MAC_PROFILE_BASE64"].split())))
          PY

          security cms -D -i "$IOS_RAW" > "$RUNNER_TEMP/ios-profile.plist"
          security cms -D -i "$MAC_RAW" > "$RUNNER_TEMP/mac-profile.plist"

          IOS_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/ios-profile.plist")"
          IOS_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/ios-profile.plist")"
          IOS_TEAM="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/ios-profile.plist")"
          IOS_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/ios-profile.plist")"

          MAC_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/mac-profile.plist")"
          MAC_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/mac-profile.plist")"
          MAC_TEAM="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/mac-profile.plist")"
          MAC_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/mac-profile.plist")"

          if [ "$IOS_TEAM" != "$APPLE_TEAM_ID" ] || [ "$MAC_TEAM" != "$APPLE_TEAM_ID" ]; then
            echo "Provisioning profile team mismatch"
            exit 1
          fi
          if [[ "$IOS_APP_ID" != "${APPLE_TEAM_ID}.${BUNDLE_ID}" ]] || [[ "$MAC_APP_ID" != "${APPLE_TEAM_ID}.${BUNDLE_ID}" ]]; then
            echo "Provisioning profile bundle ID mismatch"
            echo "iOS: $IOS_APP_ID"
            echo "Mac: $MAC_APP_ID"
            exit 1
          fi

          cp "$IOS_RAW" "$PROFILE_DIR/$IOS_UUID.mobileprovision"
          cp "$MAC_RAW" "$PROFILE_DIR/$MAC_UUID.provisionprofile"

          echo "iOS profile: $IOS_NAME [$IOS_UUID]"
          echo "Mac profile: $MAC_NAME [$MAC_UUID]"
          echo "ios_name=$IOS_NAME" >> "$GITHUB_OUTPUT"
          echo "mac_name=$MAC_NAME" >> "$GITHUB_OUTPUT"

      - name: SwiftUI preflight — iPhone / iPad
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CONSOLE_SERVER_URL="$CONSOLE_SERVER_URL" \
            build

      - name: SwiftUI preflight — Mac Catalyst
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            CODE_SIGNING_ALLOWED=NO \
            CONSOLE_SERVER_URL="$CONSOLE_SERVER_URL" \
            build

      - name: Create manual export options
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROFILE_NAME: ${{ steps.profiles.outputs.ios_name }}
          MAC_PROFILE_NAME: ${{ steps.profiles.outputs.mac_name }}
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/ExportOptions-iOS.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${IOS_PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF

          cat > "$RUNNER_TEMP/ExportOptions-Mac.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${MAC_PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF

          plutil -lint "$RUNNER_TEMP/ExportOptions-iOS.plist"
          plutil -lint "$RUNNER_TEMP/ExportOptions-Mac.plist"

      - name: Archive iPhone + iPad — fixed signing
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROFILE_NAME: ${{ steps.profiles.outputs.ios_name }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Console-iOS.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CONSOLE_SERVER_URL="$CONSOLE_SERVER_URL" \
            archive

      - name: Verify archived production endpoint — iPhone + iPad
        shell: bash
        run: |
          set -euo pipefail
          INFO_PLIST="$RUNNER_TEMP/Console-iOS.xcarchive/Products/Applications/Console.app/Info.plist"
          test -f "$INFO_PLIST"
          ARCHIVED_ENDPOINT="$(/usr/libexec/PlistBuddy -c 'Print :CONSOLE_SERVER_URL' "$INFO_PLIST")"
          echo "Archived endpoint: $ARCHIVED_ENDPOINT"
          test "$ARCHIVED_ENDPOINT" = "$CONSOLE_SERVER_URL"

      - name: Upload iPhone + iPad build to TestFlight
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_PATH: ${{ steps.api_key.outputs.path }}
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Console-iOS.xcarchive" \
            -exportPath "$RUNNER_TEMP/Console-iOS-Export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-iOS.plist" \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Archive Mac Catalyst — fixed signing
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAC_PROFILE_NAME: ${{ steps.profiles.outputs.mac_name }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -archivePath "$RUNNER_TEMP/Console-MacCatalyst.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$MAC_PROFILE_NAME" \
            DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER=NO \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CONSOLE_SERVER_URL="$CONSOLE_SERVER_URL" \
            archive

      - name: Verify archived production endpoint — Mac Catalyst
        shell: bash
        run: |
          set -euo pipefail
          INFO_PLIST="$RUNNER_TEMP/Console-MacCatalyst.xcarchive/Products/Applications/Console.app/Contents/Info.plist"
          if [ ! -f "$INFO_PLIST" ]; then
            INFO_PLIST="$RUNNER_TEMP/Console-MacCatalyst.xcarchive/Products/Applications/Console.app/Info.plist"
          fi
          test -f "$INFO_PLIST"
          ARCHIVED_ENDPOINT="$(/usr/libexec/PlistBuddy -c 'Print :CONSOLE_SERVER_URL' "$INFO_PLIST")"
          echo "Archived endpoint: $ARCHIVED_ENDPOINT"
          test "$ARCHIVED_ENDPOINT" = "$CONSOLE_SERVER_URL"

      - name: Upload Mac Catalyst build to TestFlight
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_PATH: ${{ steps.api_key.outputs.path }}
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Console-MacCatalyst.xcarchive" \
            -exportPath "$RUNNER_TEMP/Console-MacCatalyst-Export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-Mac.plist" \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Console-fixed-signing-failure-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/ios-profile.plist
            ${{ runner.temp }}/mac-profile.plist
            ${{ runner.temp }}/ExportOptions-iOS.plist
            ${{ runner.temp }}/ExportOptions-Mac.plist
          if-no-files-found: ignore
          retention-days: 3

      - name: Cleanup temporary signing keychain
        if: always()
        shell: bash
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
