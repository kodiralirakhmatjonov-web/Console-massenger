name: Console — TestFlight Cloud Signing

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "App version shown in TestFlight"
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: read

concurrency:
  group: console-testflight-cloud-signing
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      PROJECT: Console.xcodeproj
      SCHEME: Console
      BUNDLE_ID: com.console.beta

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest installed Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate native Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          test -d "$PROJECT"

      - name: Validate Apple secrets
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail

          for name in             APPLE_TEAM_ID             APP_STORE_CONNECT_KEY_ID             APP_STORE_CONNECT_ISSUER_ID             APP_STORE_CONNECT_API_KEY_BASE64
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub secret: $name"
              exit 1
            fi
          done

          echo "Required Apple secrets are present."

      - name: Prepare App Store Connect API key
        id: api_key
        shell: bash
        run: |
          set -euo pipefail

          KEY_DIR="$RUNNER_TEMP/appstoreconnect"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          raw = os.environ["API_KEY_SECRET"]
          out = Path(os.environ["KEY_PATH"])

          # Accept either the raw .p8 PEM text or Base64-encoded .p8 bytes.
          if "BEGIN PRIVATE KEY" in raw:
              data = raw.encode("utf-8")
          else:
              compact = "".join(raw.split())
              try:
                  data = base64.b64decode(compact, validate=True)
              except Exception as exc:
                  raise SystemExit(
                      "APP_STORE_CONNECT_API_KEY_BASE64 is neither a raw .p8 key "
                      "nor valid Base64."
                  ) from exc

          text = data.decode("utf-8", errors="strict")

          if "-----BEGIN PRIVATE KEY-----" not in text or "-----END PRIVATE KEY-----" not in text:
              raise SystemExit(
                  "The secret does not contain a valid App Store Connect .p8 private key."
              )

          out.write_text(text.strip() + "\n", encoding="utf-8")
          PY
        env:
          API_KEY_SECRET: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_PATH: ${{ runner.temp }}/appstoreconnect/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Publish API key path
        id: key_path
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/appstoreconnect/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$KEY_PATH"
          echo "path=$KEY_PATH" >> "$GITHUB_OUTPUT"
          echo "App Store Connect API key prepared successfully."

      - name: Native SwiftUI simulator preflight
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild             -project "$PROJECT"             -scheme "$SCHEME"             -configuration Debug             -destination 'generic/platform=iOS Simulator'             CODE_SIGNING_ALLOWED=NO             build

      - name: Archive with Apple cloud-managed signing
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_PATH: ${{ steps.key_path.outputs.path }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail

          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          ARCHIVE_PATH="$RUNNER_TEMP/Console.xcarchive"

          echo "Bundle ID: $BUNDLE_ID"
          echo "Version: $MARKETING_VERSION"
          echo "Build: $BUILD_NUMBER"

          xcodebuild             -project "$PROJECT"             -scheme "$SCHEME"             -configuration Release             -destination 'generic/platform=iOS'             -archivePath "$ARCHIVE_PATH"             PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID"             DEVELOPMENT_TEAM="$APPLE_TEAM_ID"             CODE_SIGN_STYLE=Automatic             MARKETING_VERSION="$MARKETING_VERSION"             CURRENT_PROJECT_VERSION="$BUILD_NUMBER"             -allowProvisioningUpdates             -authenticationKeyPath "$API_KEY_PATH"             -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID"             -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"             archive

      - name: Create App Store Connect export options
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF

          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload archive directly to App Store Connect / TestFlight
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_PATH: ${{ steps.key_path.outputs.path }}
        run: |
          set -euo pipefail

          ARCHIVE_PATH="$RUNNER_TEMP/Console.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/ConsoleExport"

          mkdir -p "$EXPORT_PATH"

          xcodebuild             -exportArchive             -archivePath "$ARCHIVE_PATH"             -exportPath "$EXPORT_PATH"             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"             -allowProvisioningUpdates             -authenticationKeyPath "$API_KEY_PATH"             -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID"             -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

          echo "Upload request completed."

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Console-TestFlight-failure-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/Console.xcarchive
            ${{ runner.temp }}/ExportOptions.plist
          if-no-files-found: ignore
          retention-days: 3
