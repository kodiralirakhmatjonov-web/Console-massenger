name: Console — TestFlight Cloud Signing

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "App version shown in TestFlight"
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: read

concurrency:
  group: console-testflight-cloud-signing
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      PROJECT: Console.xcodeproj
      SCHEME: Console
      BUNDLE_ID: com.iumrah.beta

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest installed Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate native Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          test -d "$PROJECT"

      - name: Validate existing Apple secrets
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail

          for name in             APPLE_TEAM_ID             APP_STORE_CONNECT_KEY_ID             APP_STORE_CONNECT_ISSUER_ID             APP_STORE_CONNECT_API_KEY_BASE64
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub secret: $name"
              exit 1
            fi
          done

          echo "Required Apple secrets are present."

      - name: Prepare App Store Connect API key
        id: api_key
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail

          KEY_DIR="$RUNNER_TEMP/appstoreconnect"
          mkdir -p "$KEY_DIR"

          KEY_PATH="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "APP_STORE_CONNECT_API_KEY_BASE64 did not decode to a valid .p8 private key."
            exit 1
          fi

          echo "path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: Native SwiftUI simulator preflight
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild             -project "$PROJECT"             -scheme "$SCHEME"             -configuration Debug             -destination 'generic/platform=iOS Simulator'             CODE_SIGNING_ALLOWED=NO             build

      - name: Archive with Apple cloud-managed signing
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_PATH: ${{ steps.api_key.outputs.path }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail

          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          ARCHIVE_PATH="$RUNNER_TEMP/Console.xcarchive"

          echo "Bundle ID: $BUNDLE_ID"
          echo "Version: $MARKETING_VERSION"
          echo "Build: $BUILD_NUMBER"

          xcodebuild             -project "$PROJECT"             -scheme "$SCHEME"             -configuration Release             -destination 'generic/platform=iOS'             -archivePath "$ARCHIVE_PATH"             PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID"             DEVELOPMENT_TEAM="$APPLE_TEAM_ID"             CODE_SIGN_STYLE=Automatic             MARKETING_VERSION="$MARKETING_VERSION"             CURRENT_PROJECT_VERSION="$BUILD_NUMBER"             -allowProvisioningUpdates             -authenticationKeyPath "$API_KEY_PATH"             -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID"             -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"             archive

      - name: Create App Store Connect export options
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF

          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload archive directly to App Store Connect / TestFlight
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_PATH: ${{ steps.api_key.outputs.path }}
        run: |
          set -euo pipefail

          ARCHIVE_PATH="$RUNNER_TEMP/Console.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/ConsoleExport"

          mkdir -p "$EXPORT_PATH"

          xcodebuild             -exportArchive             -archivePath "$ARCHIVE_PATH"             -exportPath "$EXPORT_PATH"             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"             -allowProvisioningUpdates             -authenticationKeyPath "$API_KEY_PATH"             -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID"             -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

          echo "Upload request completed. App Store Connect will process the build before it appears in TestFlight."

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Console-TestFlight-failure-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/Console.xcarchive
            ${{ runner.temp }}/ExportOptions.plist
          if-no-files-found: ignore
          retention-days: 3
